reviews:
  path_filters:
    # Review the Knuth source modules and their tests.
    - "src/infrastructure/**"
    - "src/domain/**"
    - "src/database/**"
    - "src/network/**"
    - "src/blockchain/**"
    - "src/node/**"
    - "src/node-exe/**"
    - "src/c-api/**"

    # Vendored / third-party code we do not review.
    - "!src/consensus/**"
    - "!src/secp256k1/**"

    # Non-source and generated files.
    - "!data/**"
    - "!**/*.dat"
    - "!**/*.png"
    - "!**/*.pdf"
    - "!scripts/**"
    - "!**/conanfile.py"
    - "!conan.lock"
    - "!.gitignore"
    - "!.github/**"
    - "!**/tools/**"
    - "!**/*.ipp"
    - "!**/*.S.in"
    - "!tui_screenshot.png"
    - "!doc/**"
