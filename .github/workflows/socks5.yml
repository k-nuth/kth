name: SOCKS5

# Outbound connections through a SOCKS5 proxy are an optional feature, selected
# by the Conan option `socks5` and off by default (docs/optional-features.md).
# The main workflows build without it; this one builds with it and runs the
# feature's own tests, and no others. It uses no secrets and uploads nothing.

on:
  # Not on every push to master: the nightly run covers it. Pull requests run
  # it only when they touch what it checks.
  schedule:
    - cron: '0 3 * * *'
  push:
    branches:
      - 'release/**'
      - 'hotfix/**'
      - 'dev-publish/**'
    tags:
      - v*
  workflow_dispatch:
  pull_request:
    paths:
      - src/network/CMakeLists.txt
      - src/network/include/kth/network/socks5.hpp
      - src/network/src/socks5.cpp
      - src/network/test/socks5.cpp
      - src/network/include/kth/network/peer_identity.hpp
      - src/network/include/kth/network/peer_session.hpp
      - src/network/src/peer_session.cpp
      - src/network/include/kth/network/peer_manager.hpp
      - src/network/src/peer_manager.cpp
      - src/network/include/kth/network/settings.hpp
      - src/network/src/settings.cpp
      - src/node/CMakeLists.txt
      - src/node/test/socks5.cpp
      - src/node/include/kth/node/p2p_node.hpp
      - src/node/src/p2p_node.cpp
      - src/node/src/parser.cpp
      - conanfile.py
      - conan.lock
      - CMakeLists.txt
      - .github/workflows/socks5.yml
permissions:
  contents: read
concurrency:
  group: socks5-${{ github.ref }}
  cancel-in-progress: true
jobs:
  socks5:
    runs-on: ubuntu-24.04
    container:
      image: kthnode/gcc16-ubuntu24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: true
          persist-credentials: false
      - uses: ./ci_utils/.github/actions/setup-conan
      - uses: ./ci_utils/.github/actions/setup-kthbuild
      - name: Restore dependencies
        id: dependencies
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ runner.temp }}/socks5-dependencies.tgz
          key: socks5-v1-${{ runner.os }}-${{ hashFiles('conan.lock', 'conanfile.py', 'ci_utils/.conan/profiles/*', '.github/conan/rpc-ci') }}
      - name: Import dependencies
        if: steps.dependencies.outputs.cache-hit == 'true'
        run: conan cache restore "$RUNNER_TEMP/socks5-dependencies.tgz"
      - name: Install dependencies with the feature on
        run: |
          conan install conanfile.py --version 0.0.0 -of build --build=missing \
            -pr:b .github/conan/rpc-ci -pr:h .github/conan/rpc-ci \
            -o march_id=ZLm9Pjh -o tests=True -o consensus=False -o rpc=none -o socks5=True
      - name: Export dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: conan cache save "*:*" --no-source --file="$RUNNER_TEMP/socks5-dependencies.tgz"
      - name: Cache dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ runner.temp }}/socks5-dependencies.tgz
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Build the feature's tests
        run: |
          cmake --preset conan-release -DCMAKE_VERBOSE_MAKEFILE=OFF -DGLOBAL_BUILD=ON -DENABLE_TEST=ON
          cmake --build --preset conan-release -j"$(nproc)" --target kth_network_socks5_test kth_node_socks5_test
      - name: Test the SOCKS5 client
        run: ./build/build/Release/src/network/kth_network_socks5_test
      - name: Test the node through a proxy
        run: ./build/build/Release/src/node/kth_node_socks5_test
