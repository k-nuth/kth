name: Unicode startup
on:
  pull_request:
    paths: &paths
      - src/infrastructure/**
      - tests/unicode-startup/**
      - .github/workflows/unicode-startup.yml
  push:
    branches: [master]
    paths: *paths
  workflow_dispatch:
concurrency:
  group: unicode-startup-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - run: python -m pip install conan==2.34.0 cmake==4.4.4
      - run: conan profile detect
      - run: conan install tests/unicode-startup -of build/unicode-startup --build=missing -s compiler.cppstd=23
      - run: cmake -S tests/unicode-startup -B build/unicode-startup "-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/build/unicode-startup/conan_toolchain.cmake"
      - run: cmake --build build/unicode-startup --config Release
      - run: python tests/unicode-startup/check.py build/unicode-startup/Release/unicode_startup.exe
