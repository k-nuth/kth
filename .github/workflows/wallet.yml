name: Wallet

# Wallet support in the node is an optional feature, selected by the Conan
# option `wallet` (with `neutrino`, which it needs) and off by default
# (docs/optional-features.md). The main workflows build without it; this one
# builds with it and runs the feature's own tests, and no others. It uses no
# secrets and uploads nothing.

on:
  # Not on every push to master: the nightly run covers it. Pull requests run
  # it only when they touch what it checks.
  schedule:
    - cron: '0 3 * * *'
  push:
    branches:
      - 'release/**'
      - 'hotfix/**'
      - 'dev-publish/**'
    tags:
      - v*
  workflow_dispatch:
  pull_request:
    paths:
      - src/domain/include/kth/domain/chain/input_prefix_filter.hpp
      - src/domain/src/chain/input_prefix_filter.cpp
      - src/domain/include/kth/domain/chain/script_filter_builder.hpp
      - src/domain/src/chain/script_filter_builder.cpp
      - src/blockchain/include/kth/blockchain/interface/block_chain.hpp
      - src/blockchain/src/interface/block_chain.cpp
      - src/blockchain/include/kth/blockchain/pools/transaction_organizer.hpp
      - src/blockchain/src/pools/transaction_organizer.cpp
      - src/node/CMakeLists.txt
      - src/node/include/kth/node/wallet/**
      - src/node/src/wallet/**
      - src/node/test/wallet*.cpp
      - src/node/test/wallet*.hpp
      - src/node/test/sync_harness.hpp
      - src/node/include/kth/node/rpc/json.hpp
      - src/node/src/rpc/json.cpp
      - src/node/include/kth/node/rpc/query.hpp
      - src/node/src/rpc/query.cpp
      - src/node/include/kth/node/settings.hpp
      - src/node/src/settings.cpp
      - src/node/include/kth/node/full_node.hpp
      - src/node/src/full_node.cpp
      - src/node/src/parser.cpp
      - conanfile.py
      - conan.lock
      - CMakeLists.txt
      - .github/workflows/wallet.yml
permissions:
  contents: read
concurrency:
  group: wallet-${{ github.ref }}
  cancel-in-progress: true
jobs:
  wallet:
    runs-on: ubuntu-24.04
    container:
      image: kthnode/gcc16-ubuntu24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: true
          persist-credentials: false
      - uses: ./ci_utils/.github/actions/setup-conan
      - uses: ./ci_utils/.github/actions/setup-kthbuild
      - name: Restore dependencies
        id: dependencies
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ runner.temp }}/wallet-dependencies.tgz
          key: wallet-v1-${{ runner.os }}-${{ hashFiles('conan.lock', 'conanfile.py', 'ci_utils/.conan/profiles/*', '.github/conan/rpc-ci') }}
      - name: Import dependencies
        if: steps.dependencies.outputs.cache-hit == 'true'
        run: conan cache restore "$RUNNER_TEMP/wallet-dependencies.tgz"
      - name: Install dependencies with the feature on
        run: |
          conan install conanfile.py --version 0.0.0 -of build --build=missing \
            -pr:b .github/conan/rpc-ci -pr:h .github/conan/rpc-ci \
            -o march_id=ZLm9Pjh -o tests=True -o consensus=False -o rpc=none -o neutrino=True -o wallet=True
      - name: Export dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: conan cache save "*:*" --no-source --file="$RUNNER_TEMP/wallet-dependencies.tgz"
      - name: Cache dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ runner.temp }}/wallet-dependencies.tgz
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Build the feature's tests
        run: |
          cmake --preset conan-release -DCMAKE_VERBOSE_MAKEFILE=OFF -DGLOBAL_BUILD=ON -DENABLE_TEST=ON
          cmake --build --preset conan-release -j"$(nproc)" --target kth_node_wallet_test
      - name: Test wallet support
        run: ./build/build/Release/src/node/kth_node_wallet_test
