name: Stratum V2

# Stratum V2 for pools and miners is an optional feature, selected by the
# Conan option `sv2` and off by default (docs/optional-features.md). The main
# workflows build without it; this one builds with it and runs the feature's
# own tests, and no others. It uses no secrets and uploads nothing.

on:
  # Not on every push to master: the nightly run covers it. Pull requests run
  # it only when they touch what it checks.
  schedule:
    - cron: '0 3 * * *'
  push:
    branches:
      - 'release/**'
      - 'hotfix/**'
      - 'dev-publish/**'
    tags:
      - v*
  workflow_dispatch:
  pull_request:
    paths:
      - src/node/CMakeLists.txt
      - src/node/include/kth/node/sv2/**
      - src/node/src/sv2/**
      - src/node/test/sv2_*.cpp
      - src/node/include/kth/node/detail/noise_file.hpp
      - src/infrastructure/CMakeLists.txt
      - src/infrastructure/include/kth/infrastructure/math/chacha20_poly1305.hpp
      - src/infrastructure/include/kth/infrastructure/math/hkdf.hpp
      - src/infrastructure/src/math/chacha20_poly1305.cpp
      - src/infrastructure/src/math/hkdf.cpp
      - src/infrastructure/test/math/chacha20_poly1305.cpp
      - src/infrastructure/test/math/hkdf.cpp
      - src/node/include/kth/node/mining/work_changes.hpp
      - src/node/src/mining/work_changes.cpp
      - src/node/include/kth/node/settings.hpp
      - src/node/src/settings.cpp
      - src/node/src/parser.cpp
      - src/node/include/kth/node/full_node.hpp
      - src/node/src/full_node.cpp
      - src/blockchain/include/kth/blockchain/pools/block_template.hpp
      - src/blockchain/src/interface/block_chain.cpp
      - conanfile.py
      - conan.lock
      - CMakeLists.txt
      - .github/workflows/sv2.yml
permissions:
  contents: read
concurrency:
  group: sv2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sv2:
    runs-on: ubuntu-24.04
    container:
      image: kthnode/gcc16-ubuntu24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: true
          persist-credentials: false
      - uses: ./ci_utils/.github/actions/setup-conan
      - uses: ./ci_utils/.github/actions/setup-kthbuild
      - name: Restore dependencies
        id: dependencies
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ runner.temp }}/sv2-dependencies.tgz
          key: sv2-v1-${{ runner.os }}-${{ hashFiles('conan.lock', 'conanfile.py', 'ci_utils/.conan/profiles/*', '.github/conan/rpc-ci') }}
      - name: Import dependencies
        if: steps.dependencies.outputs.cache-hit == 'true'
        run: conan cache restore "$RUNNER_TEMP/sv2-dependencies.tgz"
      - name: Install dependencies with the feature on
        run: |
          conan install conanfile.py --version 0.0.0 -of build --build=missing \
            -pr:b .github/conan/rpc-ci -pr:h .github/conan/rpc-ci \
            -o march_id=ZLm9Pjh -o tests=True -o consensus=False -o rpc=none -o sv2=True
      - name: Export dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: conan cache save "*:*" --no-source --file="$RUNNER_TEMP/sv2-dependencies.tgz"
      - name: Cache dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ runner.temp }}/sv2-dependencies.tgz
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Build the feature's tests
        run: |
          cmake --preset conan-release -DCMAKE_VERBOSE_MAKEFILE=OFF -DGLOBAL_BUILD=ON -DENABLE_TEST=ON
          cmake --build --preset conan-release -j"$(nproc)" --target kth_infrastructure_sv2_test kth_node_sv2_test
      - name: Test the Noise ciphers
        run: ./build/build/Release/src/infrastructure/kth_infrastructure_sv2_test
      - name: Test Stratum V2
        run: ./build/build/Release/src/node/kth_node_sv2_test
