name: 📊 Coverage

on:
  schedule:
    - cron: '0 3 * * *'
      timezone: Europe/Madrid
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      investigate_run:
        description: 'Optional master Coverage run ID: measure every first-parent change in its comparison interval (max 20)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: coverage-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - run: python3 -m unittest discover -s .github/scripts -p 'test_coverage_history.py' -v

  plan:
    needs: controls
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'coverage') && (github.event.action != 'labeled' || github.event.label.name == 'coverage'))
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      baseline: ${{ steps.plan.outputs.baseline }}
      investigate: ${{ steps.plan.outputs.investigate }}
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/coverage-history.py plan

  coverage:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: 📊 Coverage ${{ matrix.sha }}
    runs-on: ubuntu-24.04
    # Ceiling for the whole job. With a hot ccache, the run finishes
    # in ~25–30 min (build ~10–15 min on 86 %+ hits, tests ~7 min,
    # report + upload ~5 min). A genuinely cold run — fresh cache
    # version bump, key prefix change, or the first run after a
    # compiler upgrade in the container image — pushes the build
    # alone to ~80 min, so the cap has to clear that. 130 leaves
    # margin without letting a wedged job burn the full 6-hour
    # GHA default.
    timeout-minutes: 130
    container:
      image: kthnode/gcc16-ubuntu24.04

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      # Keep reporting code from the workflow revision when measuring old source.
      - name: Preserve coverage reporting tool
        shell: bash
        run: cp .github/scripts/coverage-history.py "$RUNNER_TEMP/coverage-history.py"

      - name: Select measured commit
        if: needs.plan.outputs.investigate == 'true'
        shell: bash
        env:
          MEASURE_SHA: ${{ matrix.sha }}
        run: |
          git checkout --detach "$MEASURE_SHA"
          git submodule update --init --recursive

      - name: 🔧 Setup Conan
        uses: ./ci_utils/.github/actions/setup-conan

      - name: 🔧 Setup kthbuild
        uses: ./ci_utils/.github/actions/setup-kthbuild

      - name: 🗄️ Setup ccache
        shell: bash
        run: |
          # Ubuntu 24.04's ccache 4.9.1 rejects -fprofile-update=atomic,
          # making every coverage compilation uncacheable. 4.10 supports it.
          archive="${RUNNER_TEMP}/ccache-4.10.2-linux-x86_64.tar.xz"
          curl --fail --location --retry 3 \
            https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-linux-x86_64.tar.xz \
            --output "$archive"
          echo "80cab87bd510eca796467aee8e663c398239e0df1c4800a0b5dff11dca0b4f18  $archive" | sha256sum --check
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          install -m 755 "$RUNNER_TEMP/ccache-4.10.2-linux-x86_64/ccache" /usr/local/bin/ccache
          ccache --version
          .github/scripts/check-coverage-cache.sh

      # Split restore/save so a flaky GH Cache Service can't fail
      # the whole job during the post-action. Recent runs have been
      # losing the runner here for 18+ min as the save POSTs to
      # `cache-service` time out — the build + tests had already
      # passed, but the job ended up red. The save below carries
      # `continue-on-error: true` so a cache-side failure becomes a
      # non-fatal warning rather than a job failure.
      - name: 🗄️ Restore ccache
        id: restore-ccache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: /github/home/.cache/ccache
          key: ccache-coverage-${{ matrix.sha }}
          restore-keys: ccache-coverage-

      - name: 📦 Install dependencies
        shell: bash
        run: |
          METRICS="${GITHUB_WORKSPACE}/.github/scripts/ci-metrics.sh"
          "$METRICS" phase-start deps
          set +e
          conan install conanfile.py --version 0.0.0 -of build --build=missing \
            -pr:b linux-ci-cd -pr:h linux-ci-cd \
            -o march_id=ZLm9Pjh -o tests=True -o consensus=True
          rc=$?
          set -e
          "$METRICS" phase-end deps "$rc"
          exit "$rc"

      - name: 🔨 Build with coverage
        shell: bash
        run: |
          METRICS="${GITHUB_WORKSPACE}/.github/scripts/ci-metrics.sh"

          # Before zeroing: this is what the restore actually produced.
          "$METRICS" ccache-snapshot before
          ccache --zero-stats

          # Force -O0 on the coverage build. PR #309 dropped this
          # to "cut test runtime by ~5×", but with -O3 + --coverage
          # gcc 15 emits much larger .gcno/.gcda files (every inlined
          # copy gets its own block bookkeeping), and gcovr 8.6 then
          # hangs for 45+ min on report generation until the GHA
          # runner kills the step. The last green coverage run on
          # master (24851108475, 2026-04-23) was on -O0 with gcovr
          # finishing in ~4 min. Slower tests are the right trade —
          # this job's purpose is the report, not benchmarking.
          #
          # And -fprofile-update=atomic, because the counters are shared and the
          # default increment is not. Two threads through the same line lose
          # updates, and a lost decrement is how geninfo comes to read a count of
          # -1 and refuse the file — which is what it did as soon as a test first
          # stood a running node up. The alternative on offer is
          # `--ignore-errors negative`, which does not make the numbers right, it
          # stops them being checked.
          "$METRICS" phase-start configure
          set +e
          cmake --preset conan-release \
            -DCMAKE_VERBOSE_MAKEFILE=OFF \
            -DGLOBAL_BUILD=ON \
            -DENABLE_TEST=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DKTH_CI_TEST_SHARDS=2 \
            -DCMAKE_C_FLAGS="-O0 --coverage -fprofile-update=atomic" \
            -DCMAKE_CXX_FLAGS="-O0 --coverage -fprofile-update=atomic" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          rc=$?
          set -e
          "$METRICS" phase-end configure "$rc"
          if [ "$rc" != 0 ]; then exit "$rc"; fi

          CPUS="$(nproc)"

          "$METRICS" phase-start compile
          set +e
          cmake --build --preset conan-release -j"$CPUS"
          rc=$?
          set -e
          "$METRICS" phase-end compile "$rc"

          # The compiler this CONTAINER used, read out of the cache CMake wrote
          # inside it. The host runner's toolchain is a different thing and is
          # not what produced these objects — reporting it would describe a
          # build that did not happen.
          CACHE_FILE="build/build/Release/CMakeCache.txt"
          CXX_COMPILER="$(awk -F= '/^CMAKE_CXX_COMPILER:/ { print $2 }' "$CACHE_FILE" 2>/dev/null)"
          CXX_LAUNCHER="$(awk -F= '/^CMAKE_CXX_COMPILER_LAUNCHER:/ { print $2 }' "$CACHE_FILE" 2>/dev/null)"
          "$METRICS" note cmake_cxx_compiler "${CXX_COMPILER:-unreadable}"
          "$METRICS" note cmake_cxx_launcher "${CXX_LAUNCHER:-unset}"
          if [ -n "${CXX_COMPILER:-}" ] && [ -x "${CXX_COMPILER}" ]; then
            "$METRICS" note compiler_version "$("${CXX_COMPILER}" --version 2>/dev/null | head -n 1)"
          else
            "$METRICS" note compiler_version "unreadable"
          fi

          "$METRICS" note cpus_visible "$CPUS"
          "$METRICS" note cmake_parallel_level "${CMAKE_BUILD_PARALLEL_LEVEL:-unset}"
          "$METRICS" note parallel_argument "$CPUS"
          "$METRICS" note build_tool "$(awk -F= '/^CMAKE_GENERATOR:/ { print $2 }' "$CACHE_FILE" 2>/dev/null || echo unreadable)"

          "$METRICS" ccache-snapshot after
          ccache --show-stats

          # Diagnostics above, verdict here.
          exit "$rc"

      # Persist ccache as soon as the build finishes — the compile
      # output is what populates it, so saving here gets the most
      # benefit on every run (even ones where tests / report fail
      # later). `continue-on-error` keeps a flaky GH Cache Service
      # save from failing the whole job; the failure becomes a
      # non-fatal warning.
      - name: 🗄️ Save ccache
        id: save-ccache
        if: always() && steps.restore-ccache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: /github/home/.cache/ccache
          key: ccache-coverage-${{ matrix.sha }}


      - name: 🧪 Run tests
        id: tests
        shell: bash
        run: |
          METRICS="${GITHUB_WORKSPACE}/.github/scripts/ci-metrics.sh"
          "$METRICS" phase-start tests
          # Catch shards execute every ordinary case, but flush the shared
          # coverage objects once per shard rather than once per test case.
          python3 .github/scripts/check-ci-test-plan.py build/build/Release --shards 2
          set +e
          ctest --preset conan-release --output-on-failure -j"$(nproc)"
          rc=$?
          set -e
          "$METRICS" phase-end tests "$rc"
          exit "$rc"

      - name: 📊 Generate coverage report
        id: report
        if: success()
        timeout-minutes: 20
        # The job runs in a container without bash, so GitHub falls back to
        # `sh -e {0}` — dash, which has no `set -o pipefail`. The step died on
        # its first line and produced no report at all, which nothing noticed
        # because the job is advisory: it reported success while doing none of
        # its work. Naming the shell is what makes the body below run.
        shell: bash
        run: |
          # Switched off gcovr to lcov. gcovr 8.5 and 8.6 both blow
          # past the GHA hosted runner's memory ceiling on this
          # project's TU count: the in-memory coverage tree gcovr
          # builds (every translation unit's parsed source +
          # decision/branch records) is held entirely in resident
          # memory before any output writer runs, and the OS kills
          # the runner with "lost communication with the server"
          # before the 20-min step timeout fires. Confirmed
          # empirically — both versions hung past the timeout on
          # this branch's coverage runs.
          #
          # lcov streams .gcda/.gcno through gcov subprocesses, so
          # peak memory is bounded by the per-process residency
          # rather than by the whole project tree. The first lcov
          # attempt on this branch still ran past the 20-min
          # timeout, but lcov was running gcov serially on every TU
          # under build/, including the ~50% of subdirs (c-api,
          # database, network, node, …) we filter out at extract
          # time anyway. The configuration below narrows the
          # capture scope to just the sub-projects we keep,
          # invokes gcov in parallel ($(nproc) workers), drops
          # branch coverage (smaller intermediate files, faster
          # parse), and keeps geninfo_unexecuted_blocks so
          # unreached functions still show as 0%. Codecov accepts
          # `coverage.info` natively, so the upload contract is
          # unchanged.
          set -o pipefail
          apt-get update -qq && apt-get install -y -qq lcov
          lcov --version
          # Pre-check the build subtrees exist before invoking lcov.
          # If a future refactor renames a sub-project, lcov would
          # warn-and-continue with a partial `coverage.info` that
          # silently shrinks the reported surface — and since this
          # job is advisory, the regression could go unnoticed.
          for d in domain infrastructure blockchain; do
            test -d "build/build/Release/src/$d" || {
              echo "::error::missing coverage source dir: build/build/Release/src/$d";
              exit 1;
            }
          done
          # `--ignore-errors mismatch` keeps lcov 2.0 from aborting
          # the whole capture when geninfo hits a "mismatched end
          # line" between gcov output and source — known
          # lcov-2.0-on-GCC-15 quirk, harmless for our usage.
          # `branch_coverage=0` is the lcov-2.x spelling of the
          # legacy `lcov_branch_coverage` option (still accepted,
          # but emits a deprecation warning per invocation).
          METRICS="${GITHUB_WORKSPACE}/.github/scripts/ci-metrics.sh"
          "$METRICS" phase-start coverage_generate
          lcov --capture \
               --directory build/build/Release/src/domain \
               --directory build/build/Release/src/infrastructure \
               --directory build/build/Release/src/blockchain \
               --base-directory . \
               --no-external \
               --parallel $(nproc) \
               --ignore-errors mismatch \
               --rc branch_coverage=0 \
               --rc geninfo_unexecuted_blocks=1 \
               --output-file coverage.info
          # Test sources still need pruning: they live alongside
          # the headers we keep, so `--no-external` and the
          # narrowed `--directory` set don't filter them.
          #
          # `unused` is needed alongside `mismatch`: lcov 2.0 makes an exclude
          # pattern that matched nothing a hard error, and whether `*/tests/*`
          # matches depends on the narrowed capture scope above. A pattern
          # finding nothing to remove is the expected outcome, not a failure,
          # and letting it abort the step is what kept the prune from ever
          # running once the shell was fixed.
          #
          # geninfo emits absolute paths even under `--base-directory .`, so
          # every SF: record names `/__w/kth/kth/...` — a path that exists only
          # inside this container. Codecov matches coverage to files by path, so
          # a report full of absolute ones measures nothing it can attribute.
          # `--substitute` makes them repository-relative, which is what the
          # rest of the pipeline and the audit below both assume.
          lcov --remove coverage.info \
               '*/test/*' '*/tests/*' \
               --substitute "s#^${PWD}/##" \
               --ignore-errors mismatch,unused \
               --rc branch_coverage=0 \
               --output-file coverage.info

          # Prove the report exists before handing it to an uploader that
          # treats a missing file as a warning. That is how the dead step
          # above stayed invisible: nothing between "produced nothing" and
          # "uploaded nothing" ever said so.
          "$METRICS" phase-end coverage_generate 0

          # Generation and validation are timed apart on purpose: lcov producing
          # a tracefile and that tracefile being worth anything are different
          # facts, and a run that is slow in one says nothing about the other.
          "$METRICS" phase-start coverage_validate
          test -s coverage.info || {
            "$METRICS" phase-end coverage_validate 1
            echo "::error::coverage.info is missing or empty"
            exit 1
          }
          records=$(grep -c '^SF:' coverage.info || true)
          bytes=$(wc -c < coverage.info)
          test "${records}" -gt 0 || {
            "$METRICS" phase-end coverage_validate 1
            echo "::error::coverage.info holds no SF: records — nothing was captured"
            exit 1
          }
          "$METRICS" phase-end coverage_validate 0
          totals=$(lcov --list coverage.info | tail -1)
          echo "coverage.info: ${bytes} bytes, ${records} source files"
          echo "${totals}"

          # What the tracefile actually measures. A count on its own cannot tell
          # a report over this repository apart from one that swept in vendored
          # or generated sources, and that difference decides whether the
          # percentage means anything. Grouped by the first two path segments.
          #
          # Expect prefixes beyond the three captured above. gcov attributes
          # inline code to the file where it is defined, so a header belonging
          # to another module appears here when the captured modules instantiate
          # or execute it — src/database shows up that way. That is the coverage
          # of code these tests really ran, not a sign that database's own
          # objects were captured: no .cpp of theirs is in the scope above.
          # Filtering those records out, or widening the scope to include the
          # module, would each distort the figure in opposite directions.
          echo "--- SF: records by prefix ---"
          sed -n 's/^SF://p' coverage.info \
            | sed 's#^\(\./\)*##' \
            | awk -F/ '{ print ($2 == "" ? $1 : $1 "/" $2) }' \
            | sort | uniq -c | sort -rn
          echo "--- SF: records that do not resolve on disk ---"
          missing=0
          while IFS= read -r f; do
            if [ ! -f "${f}" ]; then
              echo "  ${f}"
              missing=$((missing + 1))
            fi
          done < <(sed -n 's/^SF://p' coverage.info)
          echo "unresolvable SF: records: ${missing}"

          # The two properties the audit exists to establish, asserted rather
          # than printed. Printing a prefix breakdown shows the defect to whoever
          # reads the log; it does nothing to stop the next change reintroducing
          # it, which is how absolute paths survived here unnoticed in the first
          # place.
          absolute=$(grep -c '^SF:/' coverage.info || true)
          if [ "${absolute}" -ne 0 ]; then
            echo "::error::${absolute} SF: record(s) are absolute paths"
            grep -m 5 '^SF:/' coverage.info
            echo "Codecov attributes coverage by repository-relative path, so"
            echo "absolute ones attribute none of it."
            exit 1
          fi
          if [ "${missing}" -ne 0 ]; then
            echo "::error::${missing} SF: record(s) name files that do not exist"
            exit 1
          fi

          {
            echo "### Coverage"
            echo
            echo "\`coverage.info\`: **${bytes}** bytes, **${records}** source files, ${missing} unresolvable"
            echo
            echo '```'
            echo "${totals}"
            echo '```'
            echo
            echo '<details><summary>SF: records by prefix</summary>'
            echo
            echo '```'
            sed -n 's/^SF://p' coverage.info \
              | sed 's#^\(\./\)*##' \
              | awk -F/ '{ print ($2 == "" ? $1 : $1 "/" $2) }' \
              | sort | uniq -c | sort -rn
            echo '```'
            echo
            echo '</details>'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Compare against previous successful measurement
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE: ${{ needs.plan.outputs.baseline }}
        run: python3 "$RUNNER_TEMP/coverage-history.py" measure --baseline "$BASELINE"

      - name: Retain successful measurement
        if: success() && steps.tests.outcome == 'success' && steps.report.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-result-${{ matrix.sha }}
          path: |
            result.json
            coverage.info
          if-no-files-found: error
          retention-days: 90

      - name: Retain master baseline
        if: success() && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && needs.plan.outputs.investigate != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-baseline
          path: result.json
          if-no-files-found: error
          retention-days: 90

      # Opened here so the phase has a beginning. Ending a phase that never
      # started reports "measurement unavailable" — truthfully, which is why the
      # gap was invisible: the summary was right about not knowing, and nobody
      # had told it.
      - name: ⏱️ Upload start
        if: always()
        shell: bash
        run: |
          "${GITHUB_WORKSPACE}/.github/scripts/ci-metrics.sh" phase-start upload

      - name: ☁️ Upload to Codecov
        id: codecov-upload
        if: always()
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac  # v5.5.5
        with:
          files: coverage.info
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          override_commit: ${{ matrix.sha }}

      # Always, and last: a run that failed in the build, in generation or in
      # the upload is exactly the run someone opens this for. It reports what
      # happened; it does not change any of it. `continue-on-error` on the cache
      # steps and the job's own setting are untouched — nothing here decides an
      # exit code.
      - name: 📊 Where the time went
        if: always()
        shell: bash
        run: |
          METRICS="${GITHUB_WORKSPACE}/.github/scripts/ci-metrics.sh"

          # Three outcomes, kept apart. "Not reached" is a step that never ran
          # because the job ended before it; a failed upload is a step that ran
          # and did not work. Folding them together would hide a broken token
          # behind an unrelated build failure.
          case "${{ steps.codecov-upload.outcome }}" in
            success)  "$METRICS" phase-end upload 0 ;;
            failure)  "$METRICS" phase-end upload 1 ;;
            skipped|"") : ;;   # never ran: left as "not reached"
            *)        "$METRICS" phase-end upload 1 ;;
          esac

          if [ "${{ steps.restore-ccache.outcome }}" = "skipped" ]; then
            "$METRICS" note ccache_restore "not attempted (step skipped)"
          elif [ -n "${{ steps.restore-ccache.outputs.cache-matched-key }}" ]; then
            "$METRICS" note ccache_restore "matched \`${{ steps.restore-ccache.outputs.cache-matched-key }}\`"
          else
            "$METRICS" note ccache_restore "no key matched; nothing restored"
          fi

          "$METRICS" note ccache_save "${{ steps.save-ccache.outcome }} (explicit step, ran before this summary)"

          "$METRICS" summary

  investigation:
    needs: [plan, coverage]
    if: always() && needs.plan.outputs.investigate == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: coverage-result-*
          path: results
      - name: Attribute every measured transition
        if: always()
        env:
          EXPECTED_COMMITS: ${{ toJSON(fromJSON(needs.plan.outputs.matrix).sha) }}
        run: python3 .github/scripts/coverage-history.py investigate

  cache-maintenance:
    needs: [plan, coverage]
    if: success() && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && needs.plan.outputs.investigate != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Prune superseded coverage cache entries
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/ccache-prune.sh ccache-coverage-
