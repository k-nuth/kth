name: 🔌 RPC backends

# One RPC backend per binary, selected by the Conan option `rpc`. The main
# workflows build the default (jsonrpc); this one builds each other backend, with
# the node's tests and the installed-package consumer. It uses no secrets and
# never uploads anything, so it is the same on fork pull requests. A backend
# adds its own entry to the matrix.

on:
  push:
    branches: [master]
    paths: &paths
      - '.github/workflows/rpc-backends.yml'
      - '.github/conan/rpc-ci'
      - 'scripts/test_rpc_ci.py'
      - 'cmake/KthRpcBackend.cmake'
      - 'conanfile.py'
      - 'conan.lock'
      - 'scripts/test_rpc_backend.py'
      - 'src/node/**'
      - 'test_package/**'
  pull_request:
    paths: *paths
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: 🔌 rpc=${{ matrix.backend }} build + tests
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: kthnode/gcc16-ubuntu24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # No backend: the node and its tests with every RPC guard off.
          - backend: none
            targets: kth_node_test
            tests: ''
          # gRPC + Protobuf (docs/grpc.md), with its example client.
          - backend: grpc
            targets: kth_node_test kth-grpc-smoke-client
            tests: '"[grpc transport],[grpc chain],[grpc real],[grpc cookie],[grpc]"'
          # Cap'n Proto RPC (docs/capnproto-rpc.md), with its example client.
          - backend: capnproto
            targets: kth_node_test kth_capnp_chain_client
            tests: '"[capnp rpc]"'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          submodules: true
          persist-credentials: false

      - name: 🔧 Setup Conan
        uses: ./ci_utils/.github/actions/setup-conan

      - name: 🔧 Setup kthbuild
        uses: ./ci_utils/.github/actions/setup-kthbuild

      - name: 🧪 Backend selection tests
        shell: bash
        run: python3 -m unittest scripts/test_rpc_backend.py scripts/test_rpc_ci.py

      - name: 🔑 Dependency cache identity
        id: dependency-cache
        shell: bash
        run: |
          # Include the actual compiler and installed profiles: the image tag and
          # Conan configuration can change without a repository commit.
          identity="$({ c++ --version; conan --version; conan profile show -pr:b .github/conan/rpc-ci -pr:h .github/conan/rpc-ci; } | sha256sum | cut -d' ' -f1)"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: 🗄️ Restore dependency archive
        id: restore-dependencies
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ${{ runner.temp }}/rpc-dependencies.tgz
          key: rpc-deps-v1-${{ runner.os }}-${{ matrix.backend }}-${{ steps.dependency-cache.outputs.identity }}-${{ hashFiles('conan.lock', 'conanfile.py', '.github/conan/rpc-ci') }}

      - name: 🗄️ Import cached dependencies
        if: steps.restore-dependencies.outputs.cache-hit == 'true'
        shell: bash
        run: conan cache restore "$RUNNER_TEMP/rpc-dependencies.tgz"

      - name: 📦 Install dependencies
        shell: bash
        run: |
          conan install conanfile.py --version 0.0.0 -of build --build=missing \
            -pr:b .github/conan/rpc-ci -pr:h .github/conan/rpc-ci \
            -o march_id=ZLm9Pjh -o tests=True -o consensus=False -o rpc=${{ matrix.backend }}

      # Save before compiling Knuth: a later test failure must not throw away
      # expensive dependency builds. Only Conan artifacts, not credentials or
      # build trees, are archived. Caches remain scoped by GitHub's ref rules.
      - name: 🗄️ Export dependency archive
        if: steps.restore-dependencies.outputs.cache-hit != 'true'
        shell: bash
        run: conan cache save "*:*" --no-source --file="$RUNNER_TEMP/rpc-dependencies.tgz"

      - name: 🗄️ Save dependency archive
        if: steps.restore-dependencies.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ${{ runner.temp }}/rpc-dependencies.tgz
          key: ${{ steps.restore-dependencies.outputs.cache-primary-key }}

      - name: 🔨 Build
        shell: bash
        run: |
          cmake --preset conan-release -DCMAKE_VERBOSE_MAKEFILE=OFF -DGLOBAL_BUILD=ON -DENABLE_TEST=ON
          cmake --build --preset conan-release -j"$(nproc)" --target ${{ matrix.targets }} node-exe c-api

      - name: ✅ Node tests
        shell: bash
        run: ./build/build/Release/src/node/kth_node_test ${{ matrix.tests }}

      # Installed-package control: what a consumer of this backend builds against
      # (export-pkg runs test_package against the installed package). Keep the
      # same output folder, reconfigured to the production tests=False option.
      - name: 📦 Package consumer check
        shell: bash
        run: |
          # Reconfigure the same build tree with production options. Core
          # objects are reused; test executables have already been exercised.
          conan install conanfile.py --version 0.0.0 -of build --no-remote --build=never \
            -pr:b .github/conan/rpc-ci -pr:h .github/conan/rpc-ci \
            -o march_id=ZLm9Pjh -o tests=False -o consensus=False -o rpc=${{ matrix.backend }}
          cmake --preset conan-release -DCMAKE_VERBOSE_MAKEFILE=OFF -DGLOBAL_BUILD=ON -DENABLE_TEST=OFF
          cmake --build --preset conan-release -j"$(nproc)" --target node-exe c-api
          conan export-pkg conanfile.py --version 0.0.0 -of build --no-remote \
            -pr:b .github/conan/rpc-ci -pr:h .github/conan/rpc-ci \
            -o march_id=ZLm9Pjh -o tests=False -o consensus=False -o rpc=${{ matrix.backend }}

  cache-maintenance:
    name: 🧹 Retain current RPC dependency caches
    needs: backend
    if: >-
      always() && github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Remove superseded RPC archives and closed-PR caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The existing pruners accept key prefixes and preserve open PRs.
          # Keep one master archive per backend, rather than every historical key.
          for backend in none grpc capnproto; do
            .github/scripts/ccache-prune.sh "rpc-deps-v1-Linux-${backend}-"
          done
          .github/scripts/ccache-prune-closed-prs.sh
