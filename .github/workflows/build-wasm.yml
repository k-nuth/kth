name: 🌐 WebAssembly

on:
  push:
    branches:
      - master
      - 'release/**'
      - 'hotfix/**'
      - 'dev-publish/**'
  pull_request:
    branches:
      - master
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CONAN_REMOTE: kth
  CONAN_REMOTE_URL: https://packages.kth.cash/api/

jobs:
  setup:
    # Skip for cosmetic branches (docs, style, chore, noci)
    if: >-
      github.event_name != 'pull_request' ||
      (!startsWith(github.head_ref, 'docs/') &&
       !startsWith(github.head_ref, 'style/') &&
       !startsWith(github.head_ref, 'chore/') &&
       !startsWith(github.head_ref, 'noci/'))
    runs-on: ubuntu-24.04
    outputs:
      build-version: ${{ steps.version.outputs.build-version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          submodules: true
          fetch-depth: 0
      - id: version
        uses: ./ci_utils/.github/actions/determine-version
        with:
          github-ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          run-number: ${{ github.run_number }}

  build-wasm:
    needs: [setup]
    # Run on all pushes and PRs to master (except PRs from release branches)
    if: github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       !startsWith(github.head_ref, 'release/') &&
       !startsWith(github.head_ref, 'hotfix/') &&
       !startsWith(github.head_ref, 'dev-publish/'))
    runs-on: ubuntu-24.04
    name: 🌐 WebAssembly Emscripten 6 — Build

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          submodules: true

      - name: 🔧 Replace version
        uses: ./ci_utils/.github/actions/replace-version-monorepo
        with:
          new-version: ${{ needs.setup.outputs.build-version }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: 📦 Install build dependencies
        run: |
          pip install conan==2.31.2
          pip install kthbuild --upgrade
          conan --version

      - name: 🔧 Setup Conan profile
        run: |
          conan profile detect --force

          conan profile show -pr:h ./ci_utils/conan/profiles/ems6

      - name: 📥 Clone conan-toolchains (emsdk recipe)
        run: |
          git clone https://github.com/conan-io/conan-toolchains.git ~/conan-toolchains
          conan remote add conan-toolchains ~/conan-toolchains

      - name: 🔐 Add Conan remote
        run: |
          conan remote add ${{ env.CONAN_REMOTE }} ${{ env.CONAN_REMOTE_URL }} --force

      # Public dependencies remain downloadable without secrets on fork PRs.
      - name: 🔐 Conan login
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: conan remote login "${{ env.CONAN_REMOTE }}" "${{ secrets.CONAN_LOGIN_USERNAME }}" -p "${{ secrets.CONAN_3_PASSWORD }}"

      - name: 📋 Calculate dependency build order
        run: |
          VERSION="${{ needs.setup.outputs.build-version }}"
          echo "Calculating dependency build order for version: ${VERSION}"

          # Create lock and get build order
          conan lock create conanfile.py --version="${VERSION}" --lockfile=conan-wasm.lock --lockfile-out=build/conan.lock -pr:h ./ci_utils/conan/profiles/ems6 -o consensus=True

          # Explain dependency graph (commented out - fails when no missing binaries)
          # conan graph explain conanfile.py --lockfile=build/conan.lock -pr:h ./ci_utils/conan/profiles/ems6

          # Get build order (may be empty if all packages exist)
          # If there are no missing binaries, create an empty build order
          conan graph build-order conanfile.py --lockfile=build/conan.lock -f json --order-by recipe --build=missing --reduce -pr:h ./ci_utils/conan/profiles/ems6 -o consensus=True > build_order.json || {
            echo "No missing binaries to build, creating empty build order"
            echo '{"order":[]}' > build_order.json
          }

          echo "Build order:"
          cat build_order.json

      - name: 🏗️ Build and upload dependencies
        env:
          ALLOW_CONAN_UPLOAD: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          # Parse build order and build each dependency
          # Extract references and their context (build or host)
          python3 << 'PYTHON_EOF' > deps_list.txt
          import json
          import os
          import sys

          if not os.path.exists('build_order.json'):
              print("Error: build_order.json not found", file=sys.stderr)
              exit(0)

          if os.path.getsize('build_order.json') == 0:
              print("Warning: build_order.json is empty", file=sys.stderr)
              exit(0)

          with open('build_order.json', 'r') as f:
              data = json.load(f)
          if 'order' in data and data['order']:
              for level in data['order']:
                  for item in level:
                      if isinstance(item, dict) and 'ref' in item:
                          ref = item['ref']
                          # Check if it's a build requirement by looking at packages context
                          is_build = False
                          if 'packages' in item and item['packages']:
                              for pkg_list in item['packages']:
                                  for pkg in pkg_list:
                                      if isinstance(pkg, dict) and pkg.get('context') == 'build':
                                          is_build = True
                                          break
                          print(f"{ref}|{'build' if is_build else 'host'}")
          PYTHON_EOF

          while IFS='|' read -r ref context; do
            if [ -n "$ref" ]; then
              echo "Building dependency: $ref (context: $context)"
              if [ "$context" = "build" ]; then
                conan install --tool-requires="$ref" -l build/conan.lock --build=missing -pr:h ./ci_utils/conan/profiles/ems6
              else
                conan install --requires="$ref" -l build/conan.lock --build=missing -pr:h ./ci_utils/conan/profiles/ems6
              fi
              # Skip uploading emsdk (too large for remote) and ninja (build tool)
              if [ "$ALLOW_CONAN_UPLOAD" != "true" ]; then
                echo "Skipping Conan upload for external pull request: $ref"
              elif echo "$ref" | grep -qE "^(emsdk|ninja)/"; then
                echo "Skipping upload for build tool: $ref"
              else
                echo "Uploading dependency: $ref"
                conan upload "$ref" -r ${{ env.CONAN_REMOTE }} --confirm
              fi
            fi
          done < deps_list.txt

      - name: 🏗️ Build main package
        run: |
          VERSION="${{ needs.setup.outputs.build-version }}"
          echo "Building main package version: ${VERSION}"

          # Cross-build and link the installed-package consumers for both configurations.
          # test_package executes them only when Conan can_run() permits it.
          for consensus in False True; do
            conan create conanfile.py --version="${VERSION}" --lockfile=build/conan.lock -pr:h ./ci_utils/conan/profiles/ems6 --build=missing -o tests=False -o consensus="$consensus"
          done

      - name: 📊 Build summary
        if: always()
        run: |
          echo "## 🌐 WebAssembly Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📦 Package Information" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ needs.setup.outputs.build-version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** \`kth/${{ needs.setup.outputs.build-version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🔧 Build Configuration" >> $GITHUB_STEP_SUMMARY
          echo "**Toolchain:** Emscripten (emsdk/6.0.13)" >> $GITHUB_STEP_SUMMARY
          echo "**Architecture:** wasm" >> $GITHUB_STEP_SUMMARY
          echo "**Compiler:** emcc 6.0.13" >> $GITHUB_STEP_SUMMARY
          echo "**C++ Standard:** C++23" >> $GITHUB_STEP_SUMMARY
          echo "**Build Type:** Release" >> $GITHUB_STEP_SUMMARY
          echo "**Tests:** Installed-package consumers linked; runtime Worker controls run in the browser-node job" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event_name }}" = "push" ]; then
            echo "### ✅ Package Upload" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** Package will be uploaded to Conan registry" >> $GITHUB_STEP_SUMMARY
            echo "**Registry:** \`${{ env.CONAN_REMOTE_URL }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⏭️ Package Upload" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** Package will not be uploaded (PR build)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📦 Upload package to Conan remote
        if: github.event_name == 'push'
        run: |
          conan remote login -p ${{ secrets.CONAN_3_PASSWORD }} ${{ env.CONAN_REMOTE }} ${{ secrets.CONAN_LOGIN_USERNAME }}
          conan upload kth/${{ needs.setup.outputs.build-version }}@ -r ${{ env.CONAN_REMOTE }}

  browser-worker:
    needs: [setup]
    if: >-
      github.event_name != 'pull_request' ||
      (!startsWith(github.head_ref, 'release/') &&
       !startsWith(github.head_ref, 'hotfix/') &&
       !startsWith(github.head_ref, 'dev-publish/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    name: 🧭 Browser node — Build and Worker controls
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          submodules: true
      - name: 🔧 Replace version
        uses: ./ci_utils/.github/actions/replace-version-monorepo
        with:
          new-version: ${{ needs.setup.outputs.build-version }}
      - name: 🐍 Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'
      - name: 📦 Install build and browser test dependencies
        run: |
          python -m pip install conan==2.31.2 kthbuild playwright==1.55.0 websockets==15.0.1
          python -m playwright install --with-deps chromium
          conan profile detect --force
          git clone --depth 1 https://github.com/conan-io/conan-toolchains.git "$RUNNER_TEMP/conan-toolchains"
          conan remote add conan-toolchains "$RUNNER_TEMP/conan-toolchains"
          conan remote add "$CONAN_REMOTE" "$CONAN_REMOTE_URL" --force
      - name: 🏗️ Configure browser_node=True and compile controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/browser-results
          conan install . --version="${{ needs.setup.outputs.build-version }}" \
            --output-folder=build/browser-deps --lockfile=conan-wasm.lock --lockfile-partial \
            -pr:h ci_utils/conan/profiles/ems6 --build=missing \
            -o browser_node=True -o tests=False -o rpc=False -o consensus=False \
            2>&1 | tee build/browser-results/dependencies.log
          source build/browser-deps/build/Release/generators/conanbuild.sh
          cmake -S . -B build/browser -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/build/browser-deps/build/Release/generators/conan_toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_NODE_EXE=OFF -DBUILD_C_API=ON \
            -DKTH_BROWSER_NODE=ON -DKTH_BROWSER_CONTROLS=ON \
            2>&1 | tee build/browser-results/configure.log
          cmake --build build/browser --parallel 4 --target \
            browser_configuration_control browser_stream_control browser_cap_control \
            browser_eof_control browser_select_control browser_terminal_control browser_lifecycle_control \
            browser_headers_control c-api \
            2>&1 | tee build/browser-results/build.log
          node build/browser/experiments/browser-worker/browser_configuration_control.js \
            2>&1 | tee build/browser-results/configuration.log
      - name: 🌐 Run real WASM in Chromium Workers
        run: |
          set -euo pipefail
          python experiments/browser-worker/ci.py build/browser/experiments/browser-worker \
            --report build/browser-results/workers.json 2>&1 | tee build/browser-results/workers.log
      - name: 📎 Retain build logs and Worker observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: browser-worker-controls
          path: build/browser-results
          if-no-files-found: warn
